<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card of antipo.watch (Loop 006). No figure: it never goes stale. -->
  <rect width="1200" height="630" fill="#0e1116"/>
  <rect x="40" y="40" width="1120" height="550" rx="14" fill="#131820" stroke="#2b3442" stroke-width="2"/>
  <g transform="translate(96 112) scale(4.2)">
    <rect x="1" y="1" width="30" height="30" rx="5" fill="#131820" stroke="#46536a" stroke-width="1.5"/>
    <path d="M6 24H12V18H18V12H26" fill="none" stroke="#d9b36c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="26" cy="12" r="2.6" fill="#d0d7de"/>
  </g>
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" letter-spacing="2">
    <text x="262" y="182" font-size="58" font-weight="700" fill="#d0d7de">ANTHROPIC <tspan fill="#d9b36c">IPO</tspan> <tspan fill="#98a2b0" font-weight="400">WATCH</tspan></text>
    <text x="96" y="318" font-size="40" fill="#d0d7de" letter-spacing="0">Anthropic's IPO in numbers you can trace.</text>
    <text x="96" y="378" font-size="28" fill="#98a2b0" letter-spacing="0">Every figure opens the SEC filing it came from.</text>
    <text x="96" y="430" font-size="28" fill="#98a2b0" letter-spacing="0">Value · deal · lock-ups · filings · share price</text>
    <line x1="96" y1="470" x2="1104" y2="470" stroke="#2b3442" stroke-width="2"/>
    <text x="96" y="540" font-size="24" fill="#7f8a99" letter-spacing="0">Unofficial · not affiliated with Anthropic · not investment advice</text>
    <text x="264" y="234" font-size="30" font-weight="700" fill="#d9b36c" letter-spacing="1">antipo.watch</text>
  </g>
</svg>
