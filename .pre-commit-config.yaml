# Install once:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: format (ruff)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: lint (ruff)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: types (mypy)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
