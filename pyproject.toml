[project]
name = "ipo-monitor"
version = "0.6.1"
description = "ANT IPO Monitor: an independent dashboard following Anthropic's IPO, every number sourced."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.4",
    "httpx2>=1.0",
    "mypy>=1.13",
    "playwright>=1.48",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipo_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["axe_playwright_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: real-browser tests (run with: pytest -m e2e)"]
filterwarnings = ["error"]
